# Dependabot version updates.
#
# This is separate from Dependabot *security* updates, which are enabled at the
# repository level and need no config file — those only react to published
# advisories. The config below keeps dependencies current on a schedule, and
# adds the github-actions ecosystem, which security updates never cover. That
# gap is why actions/checkout@v4 quietly sat on the deprecated Node 20 runtime
# until a warning with a removal date showed up in the logs.
#
# Grouping bundles minor+patch into a few PRs instead of one per package.
# Majors are deliberately excluded from the groups so they arrive individually
# and never auto-merge — see .github/workflows/dependabot-auto-merge.yml, whose
# `group` bucket is only safe to merge because of that exclusion.
#
# IMPORTANT: the group names below (npm-minor-patch, actions-minor-patch) are
# allowlisted *by name* in scripts/classify-dependabot-update.ts. Renaming one
# here without renaming it there silently stops those PRs from auto-merging —
# they fall through to `unknown` and wait for a human. That allowlist is
# deliberate: Dependabot security updates build their own groups (npm_and_yarn,
# github_actions) that ignore this file and can contain majors, and the PR
# title shape is identical, so only the name tells them apart.
version: 2
updates:
  # npm: this is an npm-workspaces monorepo with a single root lockfile, so the
  # root entry covers packages/chrome-extension, packages/sidePanel-import and
  # packages/shared as well.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The TypeScript 7 hold is lifted: each package now pins typescript 7.x for
    # type checking. typescript-eslint still cannot run on 7 (the Go-native
    # package no longer exports the compiler's JS API), so npm additionally
    # installs a TypeScript 5.x at the root to satisfy its peer range — that
    # copy is not declared anywhere and tracks typescript-eslint automatically.
    # See docs/architecture/build-and-release.md.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
