# Dependabot version updates.
#
# This is separate from Dependabot *security* updates, which are enabled at the
# repository level and need no config file — those only react to published
# advisories. The config below keeps dependencies current on a schedule, and
# adds the github-actions ecosystem, which security updates never cover. That
# gap is why actions/checkout@v4 quietly sat on the deprecated Node 20 runtime
# until a warning with a removal date showed up in the logs.
#
# Grouping bundles minor+patch into a few PRs instead of one per package.
# Majors are deliberately excluded from the groups so they arrive individually
# and never auto-merge — see .github/workflows/dependabot-auto-merge.yml, whose
# `group` bucket is only safe to merge because of that exclusion.
version: 2
updates:
  # npm: this is an npm-workspaces monorepo with a single root lockfile, so the
  # root entry covers packages/chrome-extension, packages/sidePanel-import and
  # packages/shared as well.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # esbuild and rollup are force-pinned by the `overrides` block in the root
      # package.json (added in becd607, "Fix security issue"), which pushes them
      # past what vite 5.4 declares support for — vite asks for esbuild ^0.21.3
      # and gets 0.27.2. That works by luck, and stops working on the next bump:
      # esbuild 0.28.1 refuses to lower destructuring to the configured browser
      # target, so vite:esbuild-transpile fails with 1045 errors in the side
      # panel (observed on PR #46).
      #
      # Holding them costs nothing today: 0.27.2 sits in a gap where no live
      # advisory applies (GHSA-67mh-4wv8-2f99 covers <= 0.24.2,
      # GHSA-g7r4-m6w7-qqqr covers 0.27.3–0.28.0, and the high-severity
      # GHSA-gv7w-rqvm-qjhr has been withdrawn).
      #
      # The real fix is upgrading vite so the overrides can be deleted and
      # esbuild/rollup track it again. Drop these two entries when that happens.
      - dependency-name: esbuild
      - dependency-name: rollup
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
