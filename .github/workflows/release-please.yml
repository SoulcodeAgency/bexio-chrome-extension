name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # Make sure the Release PR actually carries a build check. 1.4.0, 1.5.0
      # and 1.6.0 were all merged without one.
      #
      # GitHub does start a `pull_request` run for the Release PR, but parks it
      # at `action_required`: this repo's fork-PR approval policy is
      # `first_time_contributors`, and the PR's author (github-actions[bot])
      # trips it. A parked run means the PR shows no build check and stays
      # UNSTABLE forever, because nobody is watching for a run that needs
      # clicking. So approve it here.
      #
      # If approval is refused — GitHub may well decide a token should not
      # approve its own run — fall back to dispatching the workflow. That
      # produces a green check on the same commit (verified: run 30626413829),
      # though it does not appear in the PR's own check list, since the rollup
      # only shows runs the PR itself triggered.
      - name: Make sure the Release PR gets a build check
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(echo "$PR_JSON" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "::warning::No headBranchName in the release-please output; skipping."
            exit 0
          fi

          # The pull_request run is created a moment after the PR itself, so
          # give it a little time to show up before concluding there is none.
          run_id=""
          for _ in $(seq 1 10); do
            run_id=$(gh run list --repo "$REPO" --workflow=node.js.yml \
              --branch "$branch" --limit 20 \
              --json databaseId,status,event \
              --jq '[.[] | select(.event == "pull_request" and .status == "action_required")][0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 6
          done

          if [ -z "$run_id" ]; then
            echo "No run awaiting approval for '$branch' — either it started on its own or none exists yet."
            exit 0
          fi

          echo "Run $run_id on '$branch' is waiting for approval; approving."
          if gh api -X POST "repos/$REPO/actions/runs/$run_id/approve" >/dev/null 2>&1; then
            echo "Approved."
          else
            echo "::warning::Could not approve run $run_id (GITHUB_TOKEN may not approve runs). Dispatching Node.js CI against '$branch' instead; the check lands on the commit but not in the PR's check list."
            gh workflow run node.js.yml --repo "$REPO" --ref "$branch"
          fi

  # release-please creates the GitHub Release with GITHUB_TOKEN, and GitHub
  # suppresses workflow runs for events raised by that token ("Events triggered
  # by the GITHUB_TOKEN will not create a new workflow run"). The `release`
  # trigger in publish-chrome-web-store.yml therefore never fires for it, so
  # the publish is invoked here instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-chrome-web-store.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish: true
    secrets: inherit
