name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # The Release PR is opened by GITHUB_TOKEN, and events raised by that
      # token never start a workflow — so `pull_request` does not fire and the
      # PR shows no build check at all. It was merged unverified for 1.4.0,
      # 1.5.0 and 1.6.0. workflow_dispatch is exempt from that rule, so start
      # the CI run explicitly against the Release PR's branch; the check then
      # attaches to that branch's head commit and shows up on the PR.
      - name: Run CI against the Release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(echo "$PR_JSON" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "::warning::No headBranchName in the release-please output; skipping the CI dispatch."
            exit 0
          fi
          echo "Dispatching Node.js CI against '$branch'."
          gh workflow run node.js.yml --repo "${{ github.repository }}" --ref "$branch"

  # release-please creates the GitHub Release with GITHUB_TOKEN, and GitHub
  # suppresses workflow runs for events raised by that token ("Events triggered
  # by the GITHUB_TOKEN will not create a new workflow run"). The `release`
  # trigger in publish-chrome-web-store.yml therefore never fires for it, so
  # the publish is invoked here instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-chrome-web-store.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish: true
    secrets: inherit
