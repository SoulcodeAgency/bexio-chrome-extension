name: publish-chrome-web-store
on:
  # Called by release-please.yml right after it creates a release. This is the
  # normal path: a release created with GITHUB_TOKEN does NOT emit a usable
  # `release` event ("Events triggered by the GITHUB_TOKEN will not create a
  # new workflow run"), so the release workflow has to invoke this one itself.
  workflow_call:
    inputs:
      tag:
        description: Tag to publish.
        required: true
        type: string
      publish:
        description: Publish to the public CWS, or upload as a draft only.
        required: false
        type: boolean
        default: true
  # Still useful for releases published by a human in the GitHub UI, which do
  # emit the event.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or ref to (re)publish (e.g. 1.4.0, or main). Must exist on the remote.
        required: true
        type: string
      publish:
        description: Actually publish to the public CWS (vs upload-only smoke test)?
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `inputs` covers both workflow_call and workflow_dispatch; on a
          # `release` event it is empty and github.ref is the release tag.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          # Kept explicit rather than reading .nvmrc, because this workflow also
          # checks out old tags to re-publish them, and tags cut before .nvmrc
          # existed would make node-version-file fail. Keep in step with .nvmrc.
          node-version: "24"
          cache: "npm"

      - run: npm ci --workspaces --include-workspace-root

      - name: Build & package
        run: pwsh -File ./Build.ps1 -CreatePackage

      - name: Upload + publish to Chrome Web Store
        # Pinned to a commit SHA, not a tag: this is the repo's only third-party
        # action and it receives all four Chrome Web Store credentials. A tag can
        # be force-moved, and the refresh token alone is enough to publish
        # arbitrary code to every installed user. Dependabot understands SHA pins
        # and keeps proposing updates, so the trailing comment names the version.
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: dist/bexio-chrome-extension.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          # A `release` event carries no inputs and always means "publish".
          publish: ${{ github.event_name == 'release' || inputs.publish }}

      - name: Attach zip to the GitHub Release
        # Runs for a release event, for the release-please chain (workflow_call
        # inherits the caller's `push` event name), and for a manual re-publish
        # — that is the recovery documented in RELEASE.md, where the release
        # already exists but its publish run failed, so the zip still has to be
        # attached. Skipped outright on a smoke test (`publish: false`).
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        # A dispatch may name a ref that has no GitHub Release (e.g. `main`, or a
        # tag whose release was never created), so check first and skip cleanly
        # instead of failing the run. The automatic paths keep failing loudly:
        # there the release is guaranteed to exist, and a missing one is a bug.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release for '$TAG'; nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" dist/bexio-chrome-extension.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
